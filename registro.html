</head>

<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Betsy.dev</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item" data-guest>
                        <a class="nav-link" href="index.html">Login</a>
                    </li>
                    <li class="nav-item" data-guest>
                        <a class="nav-link active" href="registro.html">Registro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tags.html">HTML Tags</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">Perfil</a>
                    </li>
                    <li class="nav-item" data-auth>
                        <a class="nav-link" href="usuarios.html">Usuarios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="formulario.html">Formulario</a>
                    </li>
                    <li class="nav-item d-none" data-auth>
                        <button type="button" class="btn btn-sm btn-light ms-lg-3 mt-2 mt-lg-0" id="logoutButton">
                            Cerrar sesión <span id="navUserName"></span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="login-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">

                <div class="login-card">

                    <div class="text-center mb-4">
                        <div class="login-icon">✦</div>
                        <h1>Crear cuenta</h1>
                        <p id="parrafo-principal">
                            Regístrate para acceder a tu perfil
                        </p>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="registerName" class="form-label">
                                Nombre
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="registerName"
                                autocomplete="name"
                                required
                                maxlength="100"
                                placeholder="Ingresa tu nombre">
                        </div>
                        <div class="mb-3">
                            <label for="registerEmail" class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="registerEmail"
                                autocomplete="email"
                                required
                                maxlength="150"
                                placeholder="Ingresa tu correo">
                        </div>
                        <div class="mb-3">
                            <label for="registerPassword" class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="registerPassword"
                                autocomplete="new-password"
                                required
                                minlength="6"
                                placeholder="Mínimo 6 caracteres">
                        </div>
                        <div class="mb-3">
                            <label for="registerConfirm" class="form-label">
                                Confirmar password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="registerConfirm"
                                autocomplete="new-password"
                                required
                                minlength="6"
                                placeholder="Repite tu contraseña">
                        </div>

                        <div id="registerMessage"></div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">
                            Registrarme
                        </button>

                    </form>

                    <p class="text-center mt-3 mb-0">
                        ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
                    </p>

                </div>

            </div>
        </div>
    </div>
</main>

<footer>
    <p>© 2026 Betsy.dev</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
