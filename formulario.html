    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Betsy.dev</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Login</a>
                    </li>

                        <a class="nav-link" href="tags.html">HTML Tags</a>
                    </li>

                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="formulario.html">Formulario</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="container py-5">

    <div class="text-center mb-5">
        <span class="badge rounded-pill">JavaScript</span>
        <h1 class="page-title">Formulario interactivo</h1>
        <p>Prueba diferentes elementos utilizando JavaScript.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="content-card">

                <h2>Selecciona una opción</h2>

                <div class="form-check mb-2">
                    <input
                        class="form-check-input option-radio"
                        type="radio"
                        name="option"
                        id="option1"
                        value="developer">

                    <label class="form-check-label" for="option1">
                        Desarrollo de software
                    </label>
                </div>

                <div class="form-check mb-2">
                    <input
                        class="form-check-input option-radio"
                        type="radio"
                        name="option"
                        id="option2"
                        value="data">

                    <label class="form-check-label" for="option2">
                        Data Science
                    </label>
                </div>

                <div class="form-check mb-4">
                    <input
                        class="form-check-input option-radio"
                        type="radio"
                        name="option"
                        id="option3"
                        value="security">

                    <label class="form-check-label" for="option3">
                        Ciberseguridad
                    </label>
                </div>

                <div id="radioContent" class="alert alert-info d-none">
                    Selecciona una opción para continuar.
                </div>

                <hr>

                <h2>Ubicación</h2>

                <div class="mb-3">
                    <label for="country" class="form-label">
                        País
                    </label>

                    <select id="country" class="form-select">
                        <option value="">Selecciona un país</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="region" class="form-label">
                        Región
                    </label>

                    <select id="region" class="form-select" disabled>
                        <option value="">Selecciona una región</option>
                    </select>
                </div>

                <hr>

                <h2>Confirmación</h2>

                <div class="form-check mb-2">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="terms">

                    <label class="form-check-label" for="terms">
                        Acepto los términos y condiciones
                    </label>
                </div>

                <div class="form-check mb-4">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="privacy">

                    <label class="form-check-label" for="privacy">
                        Acepto el aviso de privacidad
                    </label>
                </div>

                <button
                    id="confirmButton"
                    class="btn btn-primary w-100"
                    disabled>
                    Confirmar
                </button>

            </div>

        </div>
    </div>

</main>

<footer>
